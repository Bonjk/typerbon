<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TyperBon | 教師後台</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../style.css" />
</head>
<body>

<!-- ========== LOGIN ========== -->
<div id="teacher-login" class="screen active">
  <div class="login-bg"><div class="grid-lines"></div></div>
  <div class="login-card">
    <h1 class="logo-title">教師後台</h1>
    <p class="logo-sub">TyperBon 文章管理</p>
    <div class="input-group">
      <label for="teacher-pw">管理密碼</label>
      <input type="password" id="teacher-pw" placeholder="請輸入密碼" />
      <span class="input-error" id="teacher-login-error"></span>
    </div>
    <button class="btn-primary" id="btn-teacher-login">進入後台</button>
    <a href="../" class="teacher-link">← 回學生頁面</a>
  </div>
</div>

<!-- ========== DASHBOARD ========== -->
<div id="teacher-dashboard" class="screen" style="display:none">

  <nav class="navbar">
    <div class="nav-logo">TyperBon 教師後台</div>
    <div class="nav-info">
      <select class="theme-select" id="theme-select">
        <option value="dark">深色</option>
        <option value="light">淺色</option>
        <option value="twilight">暮色</option>
        <option value="jersey">運動服</option>
        <option value="light-purple">淺紫</option>
        <option value="dark-purple">深紫</option>
      </select>
      <button class="btn-logout" id="btn-teacher-logout">登出</button>
    </div>
  </nav>

  <div class="tab-bar">
    <button class="tab active" data-teacher-tab="articles">文章管理</button>
    <button class="tab" data-teacher-tab="records">學生成績</button>
    <button class="tab" data-teacher-tab="leaderboard">排行榜</button>
    <button class="tab" data-teacher-tab="settings">設定</button>
    <button class="tab" data-teacher-tab="exam">考試管理</button>
  </div>

  <!-- ── TAB: 文章管理 ── -->
  <div id="teacher-tab-articles" class="tab-content active">
    <div class="teacher-articles-layout">

      <div class="section-card teacher-article-panel">
        <div class="panel-header">
          <h2 class="section-title">文章列表</h2>
          <button class="btn-primary btn-sm" id="btn-add-article">+ 新增文章</button>
        </div>
        <div id="teacher-article-list" class="teacher-article-list">
          <div class="loading-state">載入中...</div>
        </div>
      </div>

      <div class="section-card teacher-editor-panel" id="teacher-editor" style="display:none">
        <h2 class="section-title" id="editor-title-label">新增文章</h2>
        <div class="input-group">
          <label>文章標題</label>
          <input type="text" id="ed-title" placeholder="例：The Solar System" />
        </div>
        <div class="input-group">
          <label>難度</label>
          <select id="ed-difficulty">
            <option value="easy">初級 Easy</option>
            <option value="medium" selected>中級 Medium</option>
            <option value="hard">高級 Hard</option>
          </select>
        </div>
        <div class="input-group">
          <label>文章內容（純英文，建議 100–300 字）</label>
          <textarea id="ed-content" class="ed-textarea" placeholder="在此貼上英文文章內容..."></textarea>
          <span class="input-hint" id="ed-word-count">0 個單字</span>
        </div>
        <div class="editor-actions">
          <button class="btn-primary" id="btn-save-article">儲存</button>
          <button class="btn-secondary" id="btn-cancel-edit">取消</button>
        </div>
        <span class="input-error" id="editor-error"></span>
      </div>

    </div>
  </div>

  <!-- ── TAB: 學生成績 ── -->
  <div id="teacher-tab-records" class="tab-content">
    <div class="section-card">
      <div class="panel-header">
        <h2 class="section-title">學生成績</h2>
        <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
          <div class="lb-toggle">
            <button class="lb-toggle-btn active" id="btn-records-class">班級</button>
            <button class="lb-toggle-btn" id="btn-records-individual">個人</button>
          </div>
          <button class="btn-secondary btn-sm" id="btn-export-all">匯出 CSV</button>
        </div>
      </div>

      <div id="records-class-panel">
        <div class="input-group" style="max-width:280px">
          <label>選擇班級</label>
          <select id="select-class">
            <option value="">請先切換至此頁載入...</option>
          </select>
        </div>
      </div>

      <div id="records-individual-panel" style="display:none">
        <div style="display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap">
          <div class="input-group" style="flex:1;min-width:200px">
            <label>班級座號</label>
            <input type="text" id="query-student-id" placeholder="五碼，如 80213" maxlength="5" />
          </div>
          <button class="btn-primary btn-sm" id="btn-query-student">查詢</button>
        </div>
      </div>

      <div id="student-records-result" class="student-records-result"></div>
    </div>
  </div>

  <!-- ── TAB: 排行榜 ── -->
  <div id="teacher-tab-leaderboard" class="tab-content">
    <div class="section-card">
      <h2 class="section-title">排行榜</h2>
      <div style="display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap">
        <div class="input-group" style="flex:1;min-width:140px">
          <label>班級篩選（三碼）</label>
          <input type="text" id="lb-class-filter" placeholder="如 802，留空則查全部" maxlength="3" />
        </div>
        <button class="btn-primary btn-sm" id="btn-lb-query">查詢班級</button>
        <button class="btn-secondary btn-sm" id="btn-lb-all">查看全部</button>
      </div>
      <div id="teacher-leaderboard-result" class="student-records-result"></div>
    </div>
  </div>

  <!-- ── TAB: 設定 ── -->
  <div id="teacher-tab-settings" class="tab-content">
    <div class="section-card" style="max-width:600px">
      <h2 class="section-title">刪除學生紀錄</h2>
      <p style="color:var(--text-muted);font-size:.875rem;margin-bottom:16px">清除指定學生的所有練習紀錄與排行榜資料，此操作無法還原。</p>
      <div style="display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap">
        <div class="input-group" style="flex:1;min-width:200px">
          <label>班級座號</label>
          <input type="text" id="delete-student-id" placeholder="五碼，如 80213" maxlength="5" />
        </div>
        <button class="btn-danger btn-sm" id="btn-delete-student-records" style="margin-bottom:1px">刪除全部紀錄</button>
      </div>
      <span class="input-error" id="delete-student-error"></span>
    </div>

    <div class="section-card" style="max-width:600px;margin-top:20px">
      <h2 class="section-title">修改密碼</h2>
      <div style="display:flex;flex-direction:column;gap:16px;max-width:400px">
        <div class="input-group">
          <label>新密碼</label>
          <input type="password" id="new-pw" placeholder="至少 6 個字元" />
        </div>
        <div class="input-group">
          <label>確認新密碼</label>
          <input type="password" id="confirm-pw" placeholder="再次輸入新密碼" />
        </div>
        <button class="btn-primary btn-sm" id="btn-change-pw" style="width:auto;align-self:flex-start">更改密碼</button>
        <span class="input-error" id="pw-change-error"></span>
      </div>
    </div>
  </div>

  <!-- ── TAB: 考試管理 ── -->
  <div id="teacher-tab-exam" class="tab-content">
    <div class="section-card" style="max-width:860px">
      <div class="panel-header">
        <h2 class="section-title">考試管理</h2>
      </div>

      <div id="exam-current-panel" style="display:none;margin-bottom:20px"></div>

      <div id="exam-new-form">
        <div style="display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;margin-bottom:10px">
          <div class="input-group" style="min-width:140px">
            <label>考試班級（三碼）</label>
            <input type="text" id="exam-class-code" maxlength="3" placeholder="如 802" />
          </div>
          <button class="btn-primary btn-sm" id="btn-start-exam" style="margin-bottom:1px">開始考試</button>
        </div>
        <div style="display:flex;gap:12px;flex-wrap:wrap">
          <div class="input-group" style="flex:1;min-width:200px">
            <label>初級文章</label>
            <select id="exam-article-easy"><option value="">請先切換至此頁...</option></select>
          </div>
          <div class="input-group" style="flex:1;min-width:200px">
            <label>中級文章</label>
            <select id="exam-article-medium"><option value="">請先切換至此頁...</option></select>
          </div>
          <div class="input-group" style="flex:1;min-width:200px">
            <label>高級文章</label>
            <select id="exam-article-hard"><option value="">請先切換至此頁...</option></select>
          </div>
        </div>
        <span class="input-error" id="exam-start-error"></span>
      </div>

      <div id="exam-results-container" class="student-records-result" style="margin-top:16px"></div>
    </div>
  </div>

</div><!-- /teacher-dashboard -->

<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.mini.min.js"></script>
<script src="../firebase-config.js"></script>
<script type="module" src="../teacher.js"></script>
</body>
</html>
